name: Archive Ntfy Messages

on:
  schedule:
    - cron: '*/5 * * * *'         # 每5分钟运行一次（测试用，稳定后再改）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Archive
        run: |
          FILENAME="ntfy_$(TZ='Asia/Shanghai' date +'%Y%m%d_%H%M%S').txt"
          curl -s "https://ntfy.sh/judy-alerts/json?poll=1&since=24h" | jq -r '. | "\(.time) \(.message)"' > "$FILENAME"
          echo "FILE=$FILENAME" >> $GITHUB_ENV
      - name: Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          if git diff --staged --quiet; then echo "No changes"; else git commit -m "Archive $(date)" && git push; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
