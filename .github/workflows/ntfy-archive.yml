name: Archive Ntfy Messages

# 触发器：每4小时自动运行一次，并允许手动触发测试
on:
  schedule:
    - cron: '0 */4 * * *'  # 每4小时运行一次，平衡时效与资源消耗
  workflow_dispatch:      # 允许从Actions页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # 检出代码

      - name: Fetch ntfy messages and append to file
        run: |
          # 获取过去24小时的JSON消息，确保不遗漏
          curl -s "https://ntfy.sh/judy-alerts/json?poll=1&since=24h" | jq -r '. | "\(.time) \(.message)"' >> ntfy_archive.txt
        # jq命令将JSON格式化为 "时间戳 消息内容"，并追加写入ntfy_archive.txt

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add ntfy_archive.txt
          # 只有文件发生变化时才提交，避免空提交
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated archive $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 使用内置令牌进行身份验证
